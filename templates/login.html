<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NLP APP | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #0d0d0d;
            --paper: #f5f0e8;
            --accent: #e84a2e;
            --accent2: #2e7de8;
            --muted: #8a8070;
            --border: #ccc5b5;
            --card: #fffdf8;
        }

        body {
            min-height: 100vh;
            background-color: var(--paper);
            background-image:
                radial-gradient(circle at 20% 50%, rgba(232,74,46,0.07) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(46,125,232,0.07) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Decorative grid lines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(13,13,13,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(13,13,13,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .layout {
            display: flex;
            width: 900px;
            max-width: 95vw;
            min-height: 560px;
            box-shadow: 8px 8px 0px var(--ink), 0 20px 60px rgba(0,0,0,0.12);
            border: 2px solid var(--ink);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Left panel */
        .panel-left {
            width: 45%;
            background: var(--ink);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .panel-left::before {
            content: 'NLP';
            position: absolute;
            bottom: -40px;
            right: -20px;
            font-family: 'Poppins', sans-serif;
            font-size: 160px;
            font-weight: 800;
            color: rgba(255,255,255,0.04);
            letter-spacing: -8px;
            line-height: 1;
            pointer-events: none;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-tag {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .brand-name {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .brand-name span { color: var(--accent); }

        .panel-desc {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            font-weight: 300;
            line-height: 1.7;
            max-width: 240px;
        }

        .dot-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .dot-grid span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: block;
        }

        .dot-grid span:nth-child(3n) { background: var(--accent); opacity: 0.6; }
        .dot-grid span:nth-child(7n) { background: var(--accent2); opacity: 0.5; }

        /* Right panel - form */
        .panel-right {
            flex: 1;
            background: var(--card);
            padding: 52px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 36px;
        }

        .form-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.5px;
        }

        .form-header p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px;
            font-weight: 300;
        }

        .error-msg {
            background: #fef0ed;
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 0 4px 4px 0;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            background: var(--paper);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            border-radius: 2px;
        }

        .field input:focus {
            border-color: var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .field input::placeholder { color: var(--border); }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--ink);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            margin-top: 8px;
            border-radius: 2px;
        }

        .btn-submit::after {
            content: '→';
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            transition: right 0.2s;
        }

        .btn-submit:hover {
            background: var(--accent);
            box-shadow: 4px 4px 0 var(--ink);
            transform: translate(-1px, -1px);
        }

        .btn-submit:hover::after { right: 14px; }

        .form-footer {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--muted);
            text-align: center;
        }

        .form-footer a {
            color: var(--ink);
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid var(--accent);
            padding-bottom: 1px;
        }

        .form-footer a:hover { color: var(--accent); }

        @media (max-width: 640px) {
            .panel-left { display: none; }
            .panel-right { padding: 40px 28px; }
            .layout { box-shadow: 4px 4px 0 var(--ink); }
        }
    </style>
</head>
<body>

<div class="layout">
    <!-- Left decorative panel -->
    <div class="panel-left">
        <div class="brand">
            <span class="brand-tag">Welcome back</span>
            <div class="brand-name">NLP<br><span>APP</span></div>
        </div>

        <p class="panel-desc">
            Natural language processing tools built for people who think in words.
        </p>

        <div>
            <div class="dot-grid">
                {% for i in range(32) %}<span></span>{% endfor %}
                <!-- Placeholder dots for template use -->
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Right form panel -->
    <div class="panel-right">
        <div class="form-header">
            <h2>Sign in</h2>
            <p>Enter your credentials to continue</p>
        </div>

        {% if message %}
        <div class="error-msg">⚠ {{ message }}</div>
        {% endif %}

        <form action="/perform_login" method="post">
            <div class="field">
                <label>Email Address</label>
                <input type="email" name="user_mail" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" name="user_pass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Login</button>
        </form>

        <div class="form-footer">
            Not a member yet? <a href="/register">Create an account</a>
        </div>
    </div>
</div>

</body>
</html>
